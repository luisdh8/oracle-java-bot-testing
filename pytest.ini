[pytest]
# Configuración de pytest para el proyecto de testing E2E

# Directorio base para tests
testpaths = tests

# Patrones de archivos de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opciones de salida
addopts =
    -v
    --strict-markers
    --tb=short
    -ra
    -p no:cacheprovider

# Markers personalizados
markers =
    smoke: Casos críticos de funcionalidad (login, crear tarea)
    regression: Tests de regresión completos
    slow: Tests que tardan más tiempo
    ui: Tests de interfaz de usuario (todos nuestros tests)
    negative: Tests negativos (rechazo esperado de datos inválidos)

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
